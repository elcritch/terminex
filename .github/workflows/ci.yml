name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        integration: [core, sigils]
    runs-on: ${{ matrix.os }}
    env:
      NIM_VERSION: 2.2.10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.integration }}-nim-${{ env.NIM_VERSION }}-atlas-${{ hashFiles('terminex.nimble') }}

      - name: Install Atlas
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Install dependencies
        run: atlas install ${{ matrix.integration == 'sigils' && '--features:sigils' || '' }}

      - name: Run tests
        run: atlas-run tests

      - name: Test core without threads
        if: matrix.integration == 'core'
        run: atlas-run tests -- --threads:off

      - name: Test worker ownership with ORC
        if: matrix.integration == 'sigils'
        run: atlas-run tests 'tests/tthreaded*.nim' -- --mm:orc

      - name: Compile examples
        run: atlas-run tests --compile-only examples/all_compile.nim
