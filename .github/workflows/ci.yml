name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NIM_VERSION: 2.2.10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Atlas deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-nim-${{ env.NIM_VERSION }}-atlas-${{ hashFiles('terminex.nimble') }}

      - name: Install Atlas
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Nim
        run: atlas env "$NIM_VERSION" --binary --github-path

      - name: Install dependencies
        run: atlas install

      - name: Run tests
        run: atlas-run tests
